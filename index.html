<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="styles.css">
    <script src="src/modules/sql-wasm.js"></script>
    <script src="src/modules/vis-network.min.js"></script>
</head>

<body>
    <header>
        <div class="header-content">
            <h1>📦 <span data-locale="version"></span></h1>
            <nav class="nav-tabs">
                <button class="nav-tab active" data-page="intake">📥 <span data-locale="page_title_intake"></span></button>
                <button class="nav-tab" data-page="storage">🏬 <span data-locale="page_title_storage"></span></button>
                <button class="nav-tab" data-page="categories">🏷️ <span data-locale="page_title_categories"></span></button>
                <button class="nav-tab" data-page="boxes">🗃️ <span data-locale="page_title_boxes"></span></button>
                <button class="nav-tab" data-page="backup">💾 <span data-locale="page_title_restore"></span></button>
                <button class="nav-tab" data-page="stats">📊 <span data-locale="page_title_stats"></span></button>
            </nav>
        </div>
    </header>

    <div class="main-wrapper">
        <main class="container">
            <!-- ITEM INTAKE PAGE -->
            <div id="intake" class="page active">
                <div class="card" id="intakeCard">
                    <h2>📥 <span data-locale="header_main"></span></h2>
                </div>

                <div class="card">
                    <div id="intakeLog" class="log-area">
                    </div>
                </div>
            </div>

            <!-- STORAGE VIEW PAGE -->
            <div id="storage" class="page">
                <div class="card" id="storageFilterCard">
                    <h2>🏬 <span data-locale="header_storage"></span></h2>
                </div>

                <div class="card">
                    <h2>🏷️ <span id="itemCategory"></span> </h2>
                    <h2>🔢 <span id="itemCount"></span> </h2>
                    <div id="itemsList" class="items-list"></div>
                    
                    <div class="pagination-controls" id="paginationControls">
                        <button class="btn-pagination" id="prevPageBtn">⬅️</button>
                        <span id="pageIndicator" class="page-info"></span>
                        <button class="btn-pagination" id="nextPageBtn">➡️</button>
                    </div>
                </div>

                <div class="card">
                    <div id="storageLog" class="log-area">
                    </div>
                </div>
            </div>

            <!-- CATEGORIES MANAGEMENT PAGE -->
            <div id="categories" class="page">
                <div class="card" id="categoryCard">
                    <h2>✨ <span data-locale="header_categories"></span></h2>
                </div>

                <div class="card">
                    <h2>📋 <span data-locale="categories_list_header"></span></h2>
                    <div id="categoriesList" class="items-list" style="min-height: auto;"></div>
                </div>

                <div class="card">
                    <div id="categoriesLog" class="log-area">
                    </div>
                </div>
            </div>

            <!-- BOXES MANAGEMENT PAGE -->
            <div id="boxes" class="page">
                <div class="card" id="boxesCard">
                    <h2>🗃️ <span data-locale="header_boxes"></span></h2>
                    <div id="boxesContainer" class="boxes-container"></div>
                </div>

                <div class="card" id="boxesGraphCard">
                    <h2>🕸️ <span data-locale="header_boxes_graph"></span></h2>
                    <div id="boxesGraphContainer" class="graph-container"></div>
                    <div id="boxesWeightsTableContainer" class="weights-table-container"></div>
                </div>

                <div class="card">
                    <div id="boxesLog" class="log-area"></div>
                </div>
            </div>

            <!-- BACKUP & RESTORE PAGE -->
            <div id="backup" class="page">
                <div class="card">
                    <h2>💾 <span data-locale="header_restore"></span></h2>
                    <p style="color: #7f8c8d; margin-bottom: 20px;"></p>
                    
                    <div class="button-group">
                        <button class="btn-success" id="exportBtn" data-locale="btn_export"></button>
                        <button class="btn-secondary" id="importBtn" data-locale="btn_import"></button>
                    </div>

                    <input type="file" id="importFile" style="display: none;" accept=".json,.sql" />
                </div>

                <div class="card">
                    <div id="backupLog" class="log-area">
                    </div>
                </div>
            </div>

            <!-- STATISTICS PAGE -->
            <div id="stats" class="page">
                <div class="card">
                    <h2>📊 <span data-locale="page_title_stats"></span></h2>
                    <p style="color: #7f8c8d; margin-bottom: 20px;">Coming soon: Linear regression analysis and inventory trends</p>
                    
                    <div class="form-group">
                        <label for="statsDate" data-locale="label_date_filter">Analysis Date</label>
                        <input type="date" id="statsDate">
                    </div>

                    <button class="btn-primary" id="analyzeBtn" data-locale="register_item_btn">Run Analysis</button>
                </div>

                <div class="card">
                    <div id="statsLog" class="log-area">
                        <div class="log-entry" data-locale="initial_log">Statistics module ready...</div>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p data-locale="version"></p>
        </footer>
    </div>

    <script type="module">
        import { HeapTests, DatabaseTests, debug } from './dist/tests.js';
        import { renderPattern, localizeDOM } from './dist/vocab.js';
        import { main } from './dist/index.js';

        // Tab navigation
        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const pageId = tab.getAttribute('data-page');
                const targetPage = document.getElementById(pageId);
                
                document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                
                if (targetPage) {
                    targetPage.classList.add('active');
                }
            });
        });

        window.onload = async () => {
            await main();
            localizeDOM();
        };

        if (debug) {
            HeapTests.run();
            DatabaseTests.run();
        }
    </script>
</body>

</html>
